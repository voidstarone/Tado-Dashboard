<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tado° dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>tado° dashboard</h1>
    <span id="status" class="status"></span>
  </header>

  <div id="reauth" class="reauth" hidden>
    <p id="reauth-msg">Your tado° login expired. Approve this device to reconnect:</p>
    <a id="reauth-link" href="#" target="_blank" rel="noopener" hidden></a>
    <p class="reauth-hint">Waiting for approval… this page reconnects automatically.</p>
  </div>

  <main id="zones" class="grid">
    <p class="loading">Loading…</p>
  </main>

  <template id="zone-card">
    <article class="card">
      <div class="card-head">
        <h2 class="zone-name"></h2>
        <span class="badge open-window" hidden>window open</span>
      </div>
      <div class="readout">
        <div class="big"><span class="cur-temp">–</span><span class="unit">°</span></div>
        <div class="sub">
          <span class="humidity">–</span>% humidity ·
          heating <span class="heating">–</span>%
        </div>
      </div>
      <div class="target">
        target <strong class="target-temp">–</strong>°
        <span class="mode-pill"></span>
      </div>
      <div class="controls">
        <button class="step" data-delta="-0.5">−</button>
        <input class="set-temp" type="number" step="0.5" min="5" max="25">
        <button class="step" data-delta="0.5">+</button>
        <button class="set">Set</button>
        <button class="auto">Auto</button>
      </div>
    </article>
  </template>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
